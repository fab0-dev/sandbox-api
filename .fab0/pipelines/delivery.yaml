# from fab0-dev/fab0-examples delivery--v0.3.0
pipeline: delivery
# A caller's call opens the run, with no item; a person may start one by hand on an item with this label.
trigger: {issue: {label: delivery}}
inputs:
  spec: {default: request} # a caller's spec, or the item's own body when the run is started by hand
  upstream: {optional: true} # another team's contract, when the caller binds one
outputs: [contract, feedback]
onStart:
  - git.run-branch
  - pr.open-run: {draft: true}
steps:
  # The task list, and whether this team provides a contract: the developer confirms them in the run session, or
  # rejects them with what to change.
  - step: plan
    gate: {human: {owner: developer, via: prompt}}
    done: {issue: {status: Done}}
  - when: {artifact: scope, path: contract, equals: true}
    steps:
      - step: contract
        gate: {auto: {agent: reviewer, model: deep}, retry: 2, then: human}
        done: {issue: {status: Done}}
  - foreach: tasks
    id: tasks
    onStart:
      - tracker.child.sync: {type: Task, title: "{unit.title}"}
    steps:
      - step: implement
        gate: {auto: {agent: reviewer, model: deep}, retry: 2, then: human}
        done: {issue: {status: Done}}
    onEnd:
      - tracker.child.close: {type: Task}
  # What this team delivered, about its own area only: the caller judges the whole.
  - step: report
    done: {issue: {status: Done}}
onEnd:
  - git.sync-base
  - pr.merge # each run pull request into main, once its required checks pass
